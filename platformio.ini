; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson @ ~6.19.4
	knolleary/PubSubClient@^2.8
	symlink://bootstrap
	git+https://github.com/argilo/secplus.git#c35de10b
build_flags = 
	'-D IMPROV_ENABLED=15000'
	'-D MQTT_KEEP_ALIVE=15'
	'-D AUTHOR="Ian Williamson"'
	'-D DEBUG_QUEUE_MSG=1'
	'-D MQTT_MAX_PACKET_SIZE=768'
monitor_speed = 115200 ; must remain at 115200 for improv
extra_scripts = build_script.py

[env:ratgdo_esp8266_hV25]
custom_prog_version = 2.59a
platform = espressif8266
board = d1_mini_lite
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
build_flags =
	${env.build_flags}
	'-D VERSION="${this.custom_prog_version}"'
	'-D ASSIGN_OUTPUT_GDO=D1'
	'-D HWV=2.5'
	'-D DEBUG_LOG'
monitor_filters = esp8266_exception_decoder

